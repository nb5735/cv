<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbwOI0P1oMCyJYfnTkzsZFfpMcDxGIwQvnHFlSfSyeB1-o08-Xmd1crX-wXE107HfY4L/exec',
coverBadge=document.getElementById('coverBadge'),coverName=document.getElementById('coverName'),
coverEmail=document.getElementById('coverEmail'),coverNav=document.getElementById('coverNav'),
screenContent=document.getElementById('screenContent'),screenToc=document.getElementById('screenToc'),
contentScroll=document.getElementById('contentScroll'),tocBtn=document.getElementById('tocBtn'),
modalOverlay=document.getElementById('abstractModal'),modalIframe=document.getElementById('modalIframe'),
currentPage='cover',cache={},dataReady=false,pubData=[],
ALL_SHEETS=['01_ongoing_research','02_ongoing_study','03_education','04_reaserch_interest','05_publications','06_presentations','07_discussion_participant','08_teaching_experience-1','09_teaching_experience-2','10_certicication','11_profession_experience','12_awards_and_scholarships','15_cv_link'],
SECTIONS=[
{page:'cover',abbr:'C',label:'Cover'},
{page:'introduction',abbr:'I',label:'Introduction'},
{page:'education',abbr:'E',label:'Education'},
{page:'research-interests',abbr:'RI',label:'Research Interests'},
{page:'publications',abbr:'P',label:'Publications'},
{page:'presentations',abbr:'P',label:'Presentations'},
{page:'discussion',abbr:'DP',label:'Discussion Participant'},
{page:'teaching',abbr:'TE',label:'Teaching Experience'},
{page:'professional',abbr:'PE',label:'Professional Experiences'},
{page:'certification',abbr:'CT',label:'Certification'},
{page:'awards',abbr:'AS',label:'Awards & Scholarships'},
{page:'ongoing-research',abbr:'OR',label:'Ongoing Research & Study',shortLabel:'Ongoing...'},
{page:'sitemap',abbr:'MAP',label:'Site Map'}
],
_currentDocUrl='',_zoomBaseScale=1,_zoomIdx=5,
_zoomSteps=[.5,.6,.7,.8,.9,1,1.1,1.2,1.4,1.6,1.8,2];

function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function filterByDsp(rows){return rows.filter(function(r){return String(r.dsp)!=='0'})}
function sortDesc(rows){rows.sort(function(a,b){return(b.no_||b.no_num||0)-(a.no_||a.no_num||0)});return rows}
function loadLocalCache(){try{var d=localStorage.getItem('cv_data');if(d){var p=JSON.parse(d);if(Date.now()-p.ts<3600000){for(var k in p.d)cache[k]=p.d[k];return true}}}catch(e){}return false}
function saveLocalCache(){try{localStorage.setItem('cv_data',JSON.stringify({ts:Date.now(),d:cache}))}catch(e){}}
var hadLocalCache=loadLocalCache();
function fetchAllSheets(){return fetch(GAS_URL+'?sheets='+encodeURIComponent(ALL_SHEETS.join(','))).then(function(r){return r.json()}).then(function(j){for(var k in j)cache[k]=j[k];saveLocalCache()})}
var dataFetchPromise=hadLocalCache?Promise.resolve():fetchAllSheets();

async function fetchFromGAS(names){
  var needed=names.filter(function(s){return!(s in cache)});
  if(needed.length){var r=await fetch(GAS_URL+'?sheets='+encodeURIComponent(needed.join(',')));if(!r.ok)throw new Error('Network');var j=await r.json();for(var k in j)cache[k]=j[k]}
  var out={};names.forEach(function(s){out[s]=cache[s]||[]});return out;
}

function showLoading(){contentScroll.innerHTML='<div class="section-loading"><div class="section-loading-spinner"></div><div class="section-loading-text">Loading...</div></div>'}
function hasCached(n){for(var i=0;i<n.length;i++){if(!(n[i] in cache))return false}return true}
function updateTocActive(){document.querySelectorAll('.toc-item').forEach(function(i){i.classList.toggle('active',i.dataset.page===currentPage)})}

function navigateTo(page){
  screenToc.classList.remove('open');
  if(page==='cover'){screenContent.classList.remove('open');currentPage='cover';updateTocActive();return}
  currentPage=page;updateTocActive();
  var sec=SECTIONS.find(function(s){return s.page===page});
  document.getElementById('contentSectionName').textContent=sec?(sec.shortLabel||sec.label):'';
  contentScroll.scrollTop=0;screenContent.classList.add('open');
  if(renderMap[page])renderMap[page]();
}

function showNavItems(){
  var items=coverNav.children,delay=0;
  for(var i=0;i<items.length;i++){
    (function(el,d){setTimeout(function(){el.classList.add('visible')},d)})(items[i],delay);
    delay+=items[i].classList.contains('cover-nav-dot')?40:100;
  }
}

function showRetryBtn(){
  document.getElementById('coverEmailLoading').style.display='none';
  var b=document.getElementById('coverRetryBtn');b.style.display='';b.classList.add('visible');
}

function retryLoad(){
  var b=document.getElementById('coverRetryBtn');b.style.display='none';b.classList.remove('visible');
  var el=document.getElementById('coverEmailLoading');el.style.display='';el.classList.add('visible');
  dataFetchPromise=fetchAllSheets();
  dataFetchPromise.then(function(){
    dataReady=true;
    document.getElementById('coverEmailLoading').style.display='none';
    coverEmail.style.display='';coverEmail.classList.add('visible');
    showNavItems();
  }).catch(showRetryBtn);
}

document.getElementById('coverRetryBtn').addEventListener('click',retryLoad);

(function(){
  var nav=SECTIONS.filter(function(s){return s.page!=='cover'&&s.page!=='sitemap'});
  nav.forEach(function(s,i){
    var a=document.createElement('span');a.className='cover-nav-link';a.textContent=s.label;
    a.addEventListener('click',function(){navigateTo(s.page)});coverNav.appendChild(a);
    if(i<nav.length-1){var d=document.createElement('span');d.className='cover-nav-dot';coverNav.appendChild(d)}
  });
  var list=document.getElementById('tocList');
  SECTIONS.forEach(function(s){
    var it=document.createElement('div');it.className='toc-item'+(s.page==='cover'?' active':'');it.dataset.page=s.page;
    it.innerHTML='<span class="toc-abbr">'+s.abbr+'</span><span class="toc-dot"></span><span class="toc-label">'+s.label+'</span>';
    it.addEventListener('click',function(){navigateTo(s.page)});list.appendChild(it);
  });
})();

(async function preload(){
  try{
    coverBadge.classList.add('visible');
    await new Promise(function(r){setTimeout(r,300)});
    coverName.classList.add('visible');
    document.getElementById('coverEmailLoading').classList.add('visible');
    await dataFetchPromise;dataReady=true;
    if(!hadLocalCache)saveLocalCache();
    document.getElementById('coverEmailLoading').style.display='none';

})();

async function renderIntroduction(){
  var h='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:60vh;padding:0 4vw;"><div class="content-item" style="line-height:2.2;">This website serves as <br><b>Jongsu Kim\'s Curriculum Vitae (CV)</b>, <br>covering everything from educational background to current research.<br><br>You can view each section from the menu, or view the full CV document below.</div>';
  var cvUrl='';try{var d=await fetchFromGAS(['15_cv_link']);var rows=d['15_cv_link']||[];if(rows.length>0)cvUrl=rows[0].url||rows[0].URL||rows[0].link||''}catch(e){}
  h+='<div style="margin-top:6vh;text-align:center;"><a href="#" class="cv-download-btn" id="cvDlBtn" data-url="'+escapeHtml(cvUrl)+'">See CV Docs</a></div></div>';
  contentScroll.innerHTML=h;
  var btn=document.getElementById('cvDlBtn');
  if(btn)btn.addEventListener('click',function(e){e.preventDefault();var u=btn.getAttribute('data-url');if(u){document.getElementById('modalTitleEl').textContent='Curriculum Vitae';openModal(u,true)}});
}

async function renderOngoingResearch(){
  if(!hasCached(['01_ongoing_research','02_ongoing_study']))showLoading();
  try{var d=await fetchFromGAS(['01_ongoing_research','02_ongoing_study']),h='';
  filterByDsp(d['01_ongoing_research']||[]).forEach(function(r,i){if(!i)h+='<div class="section-title">Research</div>';h+='<div class="content-item">'+escapeHtml(r.content)+'</div>'});
  filterByDsp(d['02_ongoing_study']||[]).forEach(function(r,i){if(!i)h+='<div class="section-title">Study</div>';h+='<div class="content-item">'+escapeHtml(r.content)+'</div>'});
  contentScroll.innerHTML=h}catch(e){}
}

async function renderEducation(){
  if(!hasCached(['03_education']))showLoading();
  try{var d=await fetchFromGAS(['03_education']),rows=filterByDsp(d['03_education']||[]),h='';
  rows.sort(function(a,b){return b.no_num-a.no_num});
  rows.forEach(function(r){
    var school=escapeHtml(r.school_name||''),region=escapeHtml(r.region||''),period=escapeHtml(r.period||''),degree=r['degree/major']?escapeHtml(r['degree/major']):'',thesis=r.thesis?escapeHtml(r.thesis):'',advisor=r.advisor?escapeHtml(r.advisor):'',link=r.abstrat_link||'';
    h+='<div class="edu-entry">';
    if(degree){
      h+='<div class="edu-school-line"><span><span class="edu-school-name">'+school+'</span>'+(region?', '+region:'')+'</span></div><div class="edu-detail"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;"><span>'+degree+'</span><span class="edu-period">'+period+'</span></div>';
      if(thesis)h+='<div>Thesis: '+thesis+'</div>';
      if(advisor&&link)h+='<div>Advisor: '+advisor+' <a href="#" class="abstract-link" data-url="'+escapeHtml(link)+'"><b><i>Abstract</i> <span class="ext-icon">&#8599;</span></b></a></div>';
      else if(advisor)h+='<div>Advisor: '+advisor+'</div>';
      else if(link)h+='<div><a href="#" class="abstract-link" data-url="'+escapeHtml(link)+'"><b><i>Abstract</i> <span class="ext-icon">&#8599;</span></b></a></div>';
      h+='</div>';
    }else{h+='<div class="edu-school-line"><span><span class="edu-school-name">'+school+'</span>, '+region+'</span><span class="edu-period">'+period+'</span></div>'}
    h+='</div>';
  });contentScroll.innerHTML=h}catch(e){}
}

async function renderTeaching(){if(!hasCached(['08_teaching_experience-1','09_teaching_experience-2']))showLoading();try{var d=await fetchFromGAS(['08_teaching_experience-1','09_teaching_experience-2']),h='';var t1=filterByDsp(d['08_teaching_experience-1']||[]);if(!t1.error){var m1=t1.filter(function(r){return r.category==1}),s1=t1.filter(function(r){return r.category==2});m1.forEach(function(m){h+='<div class="teach-block"><div class="teach-org-line"><span class="teach-org-name">'+escapeHtml(m.organization||m['organization/subject/role']||'')+'</span>';if(m.period)h+='<span class="teach-period">'+escapeHtml(m.period)+'</span>';h+='</div>';var role=m['subject/role']||'';if(role)h+='<div class="teach-role">'+escapeHtml(role)+'</div>';s1.filter(function(s){return s.upper_level==m.no_||s.upper_level==(m.no_num||m.no_)}).sort(function(a,b){return(b.no_||b.no_num||0)-(a.no_||a.no_num||0)}).forEach(function(c){h+='<div class="teach-sub"><span>'+escapeHtml(c.organization||c['organization/subject/role']||'')+'</span>';if(c.period)h+='<span class="teach-period">'+escapeHtml(c.period)+'</span>';h+='</div>'});h+='</div>'})}var t2=filterByDsp(d['09_teaching_experience-2']||[]);if(!t2.error){var m2=t2.filter(function(r){return r.category==1}),s2=t2.filter(function(r){return r.category==2});m2.forEach(function(m){h+='<div class="teach-block"><div class="teach-org-line"><span class="teach-org-name">'+escapeHtml(m['organization/subject/role']||m.organization||'')+'</span>';if(m.period)h+='<span class="teach-period">'+escapeHtml(m.period)+'</span>';h+='</div>';var cr='';s2.filter(function(s){return s.upper_level==m.no_||s.upper_level==(m.no_num||m.no_)}).sort(function(a,b){return(a.no_||a.no_num||0)-(b.no_||b.no_num||0)}).forEach(function(c){var rl=c['organization/subject/role']||'';if(rl!==cr){cr=rl;h+='<div class="teach-role">'+escapeHtml(rl)+'</div>'}h+='<div class="teach-sub"><span>'+escapeHtml(c.course_name||'')+'</span>';if(c.period)h+='<span class="teach-period">'+escapeHtml(c.period)+'</span>';h+='</div>'});h+='</div>'})}contentScroll.innerHTML=h}catch(e){}}

var renderMap={introduction:renderIntroduction,education:renderEducation,'research-interests':renderResearchInterests,publications:function(){pubData=[];renderPublications()},presentations:renderPresentations,discussion:renderDiscussion,teaching:renderTeaching,professional:renderProfessional,certification:renderCertification,awards:renderAwards,'ongoing-research':renderOngoingResearch,sitemap:renderSitemap};

document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modalBackdrop').addEventListener('click',closeModal);

document.getElementById('modalZoomIn').addEventListener('click',function(){if(_zoomIdx<_zoomSteps.length-1){_zoomIdx++;applyZoom()}});
document.getElementById('modalZoomOut').addEventListener('click',function(){if(_zoomIdx>0){_zoomIdx--;applyZoom()}});

function docBase(url){try{var m=url.match(/(https:\/\/docs\.google\.com\/document\/d\/[^/]+)/);if(m)return m[1]}catch(e){}return null}
function toDocPreview(url){var b=docBase(url);return b?b+'/preview':url.replace(/\/(edit|preview).*$/,'/preview')}
function toDocPdf(url){var b=docBase(url);return b?b+'/export?format=pdf&attachment=false':url.replace(/\/preview.*$/,'/export?format=pdf')}
function toDocPdfEmbed(url){var pdf=toDocPdf(url);return'https://docs.google.com/gview?embedded=true&url='+encodeURIComponent(pdf)}

function applyZoom(){
  var s=_zoomBaseScale*_zoomSteps[_zoomIdx],body=document.querySelector('.modal-body'),mh=body.clientHeight||(window.innerHeight-50);
  modalIframe.style.width='1040px';modalIframe.style.height=Math.ceil(mh/s)+'px';modalIframe.style.transform='scale('+s+')';
  document.getElementById('modalZoomLevel').textContent=Math.round(_zoomSteps[_zoomIdx]*100)+'%';
  var scr=document.getElementById('modalBodyScroll');if(scr){scr.scrollTop=0;scr.scrollLeft=0}
}

function openModal(url,asPdf){
  if(!url)return;
  _currentDocUrl=url;_zoomIdx=5;
  var l=document.getElementById('modalLoading');l.classList.remove('hidden');
  modalIframe.classList.remove('loaded');modalOverlay.classList.add('open');
  var body=document.querySelector('.modal-body'),mw=body.clientWidth||window.innerWidth,mh=body.clientHeight||(window.innerHeight-50);
  _zoomBaseScale=mw/1040;
  modalIframe.style.width='1040px';modalIframe.style.height=Math.ceil(mh/_zoomBaseScale)+'px';modalIframe.style.transform='scale('+_zoomBaseScale+')';
  document.getElementById('modalZoomLevel').textContent='100%';
  modalIframe.onload=function(){l.classList.add('hidden');modalIframe.classList.add('loaded')};
  modalIframe.src=asPdf?toDocPdfEmbed(url):toDocPreview(url);
}

function closeModal(){
  modalOverlay.classList.remove('open');modalIframe.classList.remove('loaded');modalIframe.src='';
  _currentDocUrl='';_zoomIdx=5;
  document.getElementById('modalZoomLevel').textContent='100%';
  document.getElementById('modalLoading').classList.remove('hidden');
  document.getElementById('modalTitleEl').textContent='Abstract';
  var scr=document.getElementById('modalBodyScroll');if(scr){scr.scrollTop=0;scr.scrollLeft=0}
}

contentScroll.addEventListener('click',function(e){var link=e.target.closest('.abstract-link');if(link){e.preventDefault();openModal(link.getAttribute('data-url'))}});
</script>
