<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CV Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:#f5f2ed;font-family:"Times New Roman",Times,serif;overflow:hidden;}
.loading-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#fff;z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .6s;}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.loading-spinner{width:40px;height:40px;border:3px solid #e8dcc8;border-top:3px solid #c4a265;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1.5em;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-bar-wrap{width:220px;height:4px;background:#e8dcc8;border-radius:2px;overflow:hidden;}
.loading-bar-fill{width:0%;height:100%;background:linear-gradient(90deg,#c4a265,#8a7a5a);border-radius:2px;transition:width .3s;}
.loading-label{margin-top:1em;font-family:Georgia,serif;font-size:14px;color:#b0a08a;font-style:italic;letter-spacing:.08em;}
/* ── Step list (initial loading) ── */
.loading-steps{margin-top:1.5em;width:240px;max-height:40vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
.loading-steps::-webkit-scrollbar{display:none;}
.loading-step{display:flex;align-items:center;gap:.5em;padding:.25em 0;font-family:Georgia,serif;font-size:12px;color:#c4b99a;font-style:italic;letter-spacing:.04em;transition:color .3s,opacity .3s;opacity:.5;}
.loading-step.active{color:#8a7a5a;opacity:1;font-weight:bold;}
.loading-step.done{color:#6a9a5a;opacity:.85;}
.loading-step.error{color:#c06060;opacity:.85;}
.loading-step-icon{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.loading-step-icon svg{width:14px;height:14px;}
.step-pending-icon{opacity:.4;}
.step-active-spinner{width:12px;height:12px;border:2px solid #e8dcc8;border-top:2px solid #c4a265;border-radius:50%;animation:spin .8s linear infinite;}

/* ── Inline loading overlay (save/reload) ── */
.inline-loading-overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(245,242,237,.82);z-index:150;justify-content:center;align-items:center;flex-direction:column;}
.inline-loading-overlay.active{display:flex;}
.inline-loading-spinner{width:32px;height:32px;border:3px solid #e8dcc8;border-top:3px solid #c4a265;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1.2em;}
.inline-loading-bar-wrap{width:200px;height:4px;background:#e8dcc8;border-radius:2px;overflow:hidden;}
.inline-loading-bar-fill{width:0%;height:100%;background:linear-gradient(90deg,#c4a265,#8a7a5a);border-radius:2px;transition:width .4s;}
.inline-loading-label{margin-top:.8em;font-family:Georgia,serif;font-size:13px;color:#b0a08a;font-style:italic;letter-spacing:.08em;}
/* ── Inline step list ── */
.inline-loading-steps{margin-top:1.2em;width:240px;max-height:30vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
.inline-loading-steps::-webkit-scrollbar{display:none;}
.inline-step{display:flex;align-items:center;gap:.5em;padding:.22em 0;font-family:Georgia,serif;font-size:12px;color:#c4b99a;font-style:italic;letter-spacing:.04em;transition:color .3s,opacity .3s;opacity:.45;}
.inline-step.active{color:#5a4632;opacity:1;font-weight:bold;}
.inline-step.done{color:#5a9a4a;opacity:.9;}
.inline-step.error{color:#c06060;opacity:.9;}
.inline-step-icon{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.inline-step-icon svg{width:14px;height:14px;}

.page-wrapper{position:relative;width:90vw;height:90vh;max-width:1200px;background:url('img/cv_mng_bgi.png') center top/cover no-repeat;border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.15);overflow:visible;}
.top-bar{position:absolute;top:1.2%;left:2%;right:2%;display:flex;justify-content:space-between;align-items:center;z-index:5;}
.btn-cv{font-family:Georgia,serif;font-size:clamp(11px,.78vw,14px);color:#e8d5a8;background:linear-gradient(135deg,#4a3c28,#6b5a3e);border:1px solid #c4a265;border-radius:3px;padding:.2em 1.1em;cursor:pointer;font-style:italic;letter-spacing:.05em;transition:background .2s;display:flex;align-items:center;}
.btn-cv:hover{background:linear-gradient(135deg,#5a4d38,#7a6845);}
.logout-btn{font-family:Georgia,serif;font-size:clamp(11px,.78vw,14px);color:#fff;background:rgba(140,60,60,.75);border:1px solid rgba(180,90,90,.6);border-radius:3px;padding:.2em 1.1em;cursor:pointer;font-style:italic;display:flex;align-items:center;}
.logout-btn:hover{background:rgba(160,50,50,.9);}
.content-header{position:absolute;top:8%;left:2%;right:2%;z-index:5;background:#fff;padding:1% 2% 0;}
.content-cards{position:absolute;top:18%;left:2%;right:2%;bottom:2%;overflow-y:auto;overflow-x:hidden;padding:.5vh 2% 5vh;scrollbar-width:none;-ms-overflow-style:none;background:#fff;}
.content-cards::-webkit-scrollbar{display:none;}
.mng-tabs{position:absolute;top:8%;left:100%;bottom:2%;width:clamp(115px,12.5vw,170px);display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none;z-index:1;}
.mng-tabs::-webkit-scrollbar{display:none;}
.mng-tab{padding:.9em .9em .9em 1.1em;font-family:Georgia,serif;font-size:clamp(11px,.82vw,15px);font-style:italic;font-weight:bold;color:#8a7a5a;background:rgba(240,235,225,.85);border:1px solid #d4c9b0;border-right:1px solid #d4c9b0;border-radius:4px 0 0 4px;cursor:pointer;text-align:left;line-height:1.15;transition:background .2s,color .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.mng-tab:hover{background:rgba(220,210,190,.95);color:#5a4632;}
.mng-tab.active{background:rgba(60,36,21,.92);color:#e8d5a8;border-color:#6b5a3e;border-right-color:#6b5a3e;}
.sec-title{font-size:clamp(18px,1.6vw,28px);font-weight:bold;color:#3C2415;margin:0;padding:0 0 .8vh;letter-spacing:.05em;text-decoration:underline;text-underline-offset:.4em;}
.toolbar{display:flex;justify-content:flex-end;gap:.6em;padding:.5vh 0 .8vh;align-items:center;border-bottom:1px solid #e8dcc8;}
.btn{font-family:Georgia,serif;font-size:clamp(12px,.85vw,15px);padding:.4em 1em;border-radius:3px;cursor:pointer;transition:background .2s;letter-spacing:.04em;border:1px solid;}
.btn-add{background:#3C2415;color:#e8d5a8;border-color:#6b5a3e;padding:.5em 1.6em;}
.btn-add:hover{background:#5a4632;}
.btn-sort{background:#f0ebe0;color:#5a4632;border-color:#c4a265;padding:.5em 1.4em;display:none;}
.btn-sort:hover{background:#e8dcc8;}
.btn-sort.dirty{display:inline-block;animation:pulse .8s ease-in-out infinite alternate;}
@keyframes pulse{from{box-shadow:0 0 0 rgba(196,162,101,0);}to{box-shadow:0 0 8px rgba(196,162,101,.5);}}
.btn-open{background:rgba(196,162,101,.18);color:#5a4632;border-color:#c4a265;font-size:clamp(12px,.85vw,15px);padding:.4em 1.1em;font-weight:bold;}
.btn-open:hover{background:rgba(196,162,101,.35);}
.btn-modify{background:rgba(196,162,101,.18);color:#5a4632;border-color:#c4a265;font-size:clamp(12px,.85vw,15px);padding:.4em 1.1em;font-weight:bold;}
.btn-modify:hover{background:rgba(196,162,101,.35);}
.btn-save{background:linear-gradient(135deg,#4a3c28,#6b5a3e);color:#e8d5a8;border-color:#c4a265;}
.btn-save:hover{background:linear-gradient(135deg,#5a4d38,#7a6845);}
.btn-cancel{background:#f0ebe0;color:#5a4632;border-color:#c4a265;}
.btn-cancel:hover{background:#e8dcc8;}
.btn-del{background:#f0ebe0;color:#a04040;border-color:#c08080;padding:.4em 1em;}
.btn-del:hover{background:#f5e0e0;}
.btn-arrow{background:none;border:1px solid #d4c9b0;color:#8a7a5a;padding:.2em .55em;font-size:clamp(12px,.85vw,15px);border-radius:2px;cursor:pointer;line-height:1;}
.btn-arrow:hover{background:#e8dcc8;color:#3C2415;}
.btn-preview{background:none;border:1px solid #c4a265;color:#c4a265;font-size:clamp(10px,.7vw,12px);padding:.15em .5em;border-radius:2px;cursor:pointer;margin-left:.5em;}
.btn-preview:hover{background:rgba(196,162,101,.15);}
.card{background:#fff;border:1px solid #e0d8c8;border-radius:5px;margin-bottom:1.4vh;padding:1.1em 1.3em;position:relative;transition:box-shadow .2s;padding-right:7em;}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);}
.card.dsp-off{opacity:.25;}
.card.cat-head{border:2.5px solid #8a7a5a;}
.card.card-open{padding-right:13em;}
.card.card-open .card-actions{position:absolute;top:.7em;right:.8em;display:flex;gap:.4em;align-items:center;}
.card.card-open .card-top{margin-bottom:0;}
.card-top{display:flex;align-items:flex-start;gap:.7em;}
.card-controls{display:flex;flex-direction:column;gap:3px;align-items:center;flex-shrink:0;min-width:2em;}
.card-body{flex:1;min-width:0;overflow:hidden;}
.card-actions{position:absolute;top:.7em;right:.8em;display:flex;gap:.4em;align-items:center;}
.card-content{font-size:clamp(14px,1.1vw,19px);color:#3C2415;line-height:1.7;}
.card-content-trunc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;}
.card-school{font-weight:bold;font-size:clamp(14px,1.1vw,19px);}
.card-region{color:#5a4632;font-style:italic;}
.card-period{color:#8a7a5a;font-size:clamp(12px,.88vw,15px);display:block;margin-top:.25em;}
.card-degree{margin-top:.35em;font-size:clamp(13px,1vw,17px);}
.card-sub{color:#6b5a3e;font-size:clamp(12px,.88vw,15px);margin-top:.25em;font-style:italic;}
.card-meta{color:#8a7a5a;font-size:clamp(12px,.85vw,14px);margin-top:.3em;}
.card-doi a{color:#4a7a9a;text-decoration:none;font-size:clamp(11px,.82vw,14px);}
.card-doi a:hover{text-decoration:underline;}
/* ── Open detail view ── */
.card-detail{margin-top:.8em;border-top:1px solid #e8dcc8;padding-top:.8em;}
.detail-row{margin-bottom:.5em;font-size:clamp(12px,.88vw,15px);line-height:1.6;padding-left:3em;text-indent:-3em;}
.detail-label{color:#8a7a5a;font-weight:bold;font-size:clamp(12px,.88vw,15px);display:inline;margin-right:.4em;}
.detail-val{color:#3C2415;}
.detail-val a{color:#4a7a9a;}
/* ── Edit Mode ── */
.card.editing{border-color:#c4a265;box-shadow:0 2px 12px rgba(196,162,101,.15);padding-right:1.3em;}
.edit-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1em;gap:.6em;}
.edit-topbar-btns{display:flex;gap:.5em;align-items:center;}
.edit-row{margin-bottom:.9em;}
.edit-row label{display:block;font-size:clamp(11px,.78vw,14px);color:#8a7a5a;font-weight:bold;margin-bottom:.25em;}
.edit-row input,.edit-row textarea{width:100%;padding:.5em .7em;font-family:"Times New Roman",serif;font-size:clamp(13px,.95vw,17px);border:1px solid #d4c9b0;border-radius:3px;background:#fdfcfa;color:#3C2415;outline:none;}
.edit-row textarea{resize:vertical;min-height:3.5em;}
.edit-row input:focus,.edit-row textarea:focus{border-color:#c4a265;}
.edit-row-inline{display:flex;align-items:center;gap:.4em;}
.edit-row-inline input{flex:1;}
.toggle-wrap{display:flex;align-items:center;gap:.5em;cursor:pointer;font-size:clamp(12px,.85vw,15px);color:#5a4632;font-style:italic;user-select:none;}
.toggle-track{position:relative;width:36px;height:20px;background:#ccc;border-radius:10px;transition:background .25s;flex-shrink:0;}
.toggle-track.on{background:#8ab07a;}
.toggle-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-track.on .toggle-knob{transform:translateX(16px);}
.loading-text{font-style:italic;color:#999;font-size:clamp(14px,1.1vw,18px);padding:3vh 0;}
/* ── Modals ── */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.55);z-index:100;justify-content:center;align-items:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:linear-gradient(135deg,#2a2318,#3d3225,#2a2318);border:1px solid #6b5a3e;border-radius:8px;padding:2em 2.5em;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);max-width:380px;}
.modal-box p{font-family:Georgia,serif;font-size:clamp(14px,1vw,18px);color:#e8d5a8;margin-bottom:1.5em;font-style:italic;}
.modal-btns{display:flex;gap:1em;justify-content:center;}
.modal-btns .btn{padding:.55em 1.6em;font-size:clamp(13px,.9vw,16px);}
.form-modal-content{background:#faf8f4;border:1px solid #c4a265;border-radius:8px;padding:1.8em 2.2em;box-shadow:0 8px 40px rgba(0,0,0,.3);width:clamp(360px,42vw,620px);max-height:82vh;overflow-y:auto;position:relative;scrollbar-width:none;}
.form-modal-content::-webkit-scrollbar{display:none;}
.form-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2em;cursor:move;user-select:none;}
.form-modal-title{font-size:clamp(15px,1.1vw,20px);font-weight:bold;color:#3C2415;letter-spacing:.05em;}
.form-modal-header-btns{display:flex;gap:.5em;}
.form-modal-close{font-size:clamp(16px,1.1vw,20px);color:#8a7a5a;background:none;border:none;cursor:pointer;}
.form-modal-close:hover{color:#3C2415;}
.form-modal-msg{font-style:italic;font-size:clamp(11px,.78vw,14px);min-height:1.3em;margin-top:.6em;text-align:center;}
.status-ok{color:#4a8;}.status-err{color:#c66;}
/* Preview modal */
.preview-modal-content{background:#fff;border-radius:8px;width:80vw;max-width:900px;height:75vh;overflow:hidden;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.4);}
.preview-modal-content iframe{width:100%;height:calc(100% - 2.5em);border:none;}
.preview-modal-bar{height:2.5em;display:flex;align-items:center;justify-content:flex-end;padding:0 1em;background:#f0ebe0;border-bottom:1px solid #d4c9b0;}
/* Manager modal */
.mgr-modal-content{background:linear-gradient(135deg,#2a2318,#3d3225,#2a2318);border:1px solid #6b5a3e;border-radius:8px;padding:2em 2.5em;box-shadow:0 8px 40px rgba(0,0,0,.6);width:clamp(320px,28vw,440px);position:relative;}
.mgr-title{font-family:Georgia,serif;font-size:clamp(15px,1.1vw,20px);color:#e8d5a8;font-style:italic;margin-bottom:1.5em;letter-spacing:.08em;text-align:center;}
.mgr-field{margin-bottom:1.2em;}
.mgr-field label{display:block;font-family:Georgia,serif;font-size:clamp(11px,.78vw,14px);color:#C4A265;font-style:italic;margin-bottom:.3em;}
.mgr-field input{width:100%;padding:.55em .7em;font-family:Georgia,serif;font-size:clamp(12px,.88vw,16px);background:#1a1610;border:1px solid #6b5a3e;border-radius:4px;color:#e8d5a8;outline:none;}
.mgr-field input:focus{border-color:#C4A265;}
.mgr-msg{font-family:Georgia,serif;font-style:italic;font-size:clamp(11px,.78vw,14px);min-height:1.5em;margin-bottom:1em;text-align:center;}
.mgr-save-btn{width:100%;padding:.6em;font-family:Georgia,serif;font-size:clamp(12px,.85vw,15px);letter-spacing:.12em;color:#e8d5a8;background:linear-gradient(135deg,#4a3c28,#6b5a3e,#4a3c28);border:1px solid #C4A265;border-radius:4px;cursor:pointer;}
.mgr-save-btn:hover{background:linear-gradient(135deg,#5a4d38,#7a6845,#5a4d38);}
.mgr-close{position:absolute;top:.8em;right:1em;font-size:16px;color:#8a7a5a;background:none;border:none;cursor:pointer;}
.mgr-close:hover{color:#e8d5a8;}
</style></head><body>

<!-- Inline loading overlay -->
<div class="inline-loading-overlay" id="inlineLoading">
  <div class="inline-loading-spinner"></div>
  <div class="inline-loading-bar-wrap"><div class="inline-loading-bar-fill" id="inlineLoadingBar"></div></div>
  <div class="inline-loading-label" id="inlineLoadingLabel">Loading...</div>
  <div class="inline-loading-steps" id="inlineLoadingSteps"></div>
</div>

<!-- Initial full-page loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-bar-wrap"><div class="loading-bar-fill" id="loadingBar"></div></div>
  <div class="loading-label" id="loadingLabel">Preparing...</div>
  <div class="loading-steps" id="loadingSteps"></div>
</div>

<div class="page-wrapper">
  <div class="top-bar"><div></div><div style="display:flex;gap:.6em;align-items:stretch;"><button class="btn-cv" onclick="window.open('main_c.html','_blank')">CV 확인하기</button><button class="btn-cv" onclick="window.open('https://docs.google.com/spreadsheets/d/1OmDnDwGptPLZ3AOVTNLFjCJT5omBXbvLJ9SXb_PZlF0/edit?usp=sharing','_blank')">See Sheet</button><button class="logout-btn" id="logoutBtn">Logout</button></div></div>
  <div class="content-header" id="contentHeader"></div>

</div>

<div class="modal-overlay" id="addModal"><div class="form-modal-content" id="addModalContent"><div class="form-modal-header"><div class="form-modal-title">Add New Item</div><div class="form-modal-header-btns"><button class="btn btn-save" id="addModalSave">Save</button><button class="btn btn-cancel" id="addModalCancel">Cancel</button></div></div><div id="addFields"></div><div class="form-modal-msg" id="addModalMsg"></div></div></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbwOI0P1oMCyJYfnTkzsZFfpMcDxGIwQvnHFlSfSyeB1-o08-Xmd1crX-wXE107HfY4L/exec';
const TABS=[
  {id:'cv-link',label:'CV Docs Link',sheet:'15_cv_link',type:'cvlink'},
  {id:'ongoing-research',label:'Ongoing Research',sheet:'01_ongoing_research',type:'simple',sortAsc:true},
  {id:'ongoing-study',label:'Ongoing Study',sheet:'02_ongoing_study',type:'simple',sortAsc:true},
  {id:'education',label:'Education',sheet:'03_education',type:'education'},
  {id:'research-interests',label:'Research Interests',sheet:'04_reaserch_interest',type:'simple',sortAsc:true},
  {id:'publications',label:'Publications',sheet:'05_publications',type:'publication'},
  {id:'presentations',label:'Presentations',sheet:'06_presentations',type:'simple'},
  {id:'discussion',label:'Discussion',sheet:'07_discussion_participant',type:'discussion'},
  {id:'teaching-1',label:'Teaching Exp. 1',sheet:'08_teaching_experience-1',type:'teaching'},
  {id:'teaching-2',label:'Teaching Exp. 2',sheet:'09_teaching_experience-2',type:'teaching2'},
  {id:'certification',label:'Certification',sheet:'10_certicication',type:'certification'},
  {id:'professional',label:'Professional Exp.',sheet:'11_profession_experience',type:'professional'},
  {id:'awards',label:'Awards',sheet:'12_awards_and_scholarships',type:'awards'},
  {id:'manager',label:'Manager Info',sheet:'14_manager_infor',type:'manager'}
];
const ALL_SHEETS=TABS.map(t=>t.sheet);
const cache={};const contentArea=document.getElementById('contentArea');
let currentTab=null,currentData=[],mgrData=[],sortDirty=false;

/* ══════════════════════════════════════════
   Step-based progress tracker
   ══════════════════════════════════════════ */
const ICON_PENDING='<span class="step-pending-icon"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="#c4b99a" stroke-width="1.5"/></svg></span>';
const ICON_ACTIVE='<span class="step-active-spinner"></span>';
const ICON_DONE='<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" fill="#6a9a5a" opacity=".15"/><circle cx="8" cy="8" r="6" stroke="#6a9a5a" stroke-width="1.5"/><path d="M5 8.2l2 2 4-4.4" stroke="#6a9a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_ERROR='<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" fill="#c06060" opacity=".12"/><circle cx="8" cy="8" r="6" stroke="#c06060" stroke-width="1.5"/><path d="M6 6l4 4M10 6l-4 4" stroke="#c06060" stroke-width="1.5" stroke-linecap="round"/></svg>';

/** Create a step tracker bound to a container element.
 *  steps: [{label:'...'}]
 *  Returns {setActive(i), setDone(i), setError(i), setAllDone()} */
function createStepTracker(containerEl,steps){
  containerEl.innerHTML='';
  var els=[];
  steps.forEach(function(s,i){
    var div=document.createElement('div');
    div.className=(containerEl.id==='loadingSteps'?'loading-step':'inline-step');
    div.innerHTML='<span class="'+(containerEl.id==='loadingSteps'?'loading-step-icon':'inline-step-icon')+'">'+ICON_PENDING+'</span><span>'+s.label+'</span>';
    containerEl.appendChild(div);
    els.push(div);
  });
  function iconEl(i){return els[i].querySelector(containerEl.id==='loadingSteps'?'.loading-step-icon':'.inline-step-icon');}
  return {
    setActive:function(i){
      if(i<0||i>=els.length)return;
      els[i].className=(containerEl.id==='loadingSteps'?'loading-step active':'inline-step active');
      iconEl(i).innerHTML=ICON_ACTIVE;
      // scroll into view
      els[i].scrollIntoView&&els[i].scrollIntoView({block:'nearest',behavior:'smooth'});
    },
    setDone:function(i){
      if(i<0||i>=els.length)return;
      els[i].className=(containerEl.id==='loadingSteps'?'loading-step done':'inline-step done');
      iconEl(i).innerHTML=ICON_DONE;
    },
    setError:function(i){
      if(i<0||i>=els.length)return;
      els[i].className=(containerEl.id==='loadingSteps'?'loading-step error':'inline-step error');
      iconEl(i).innerHTML=ICON_ERROR;
    },
    setAllDone:function(){
      for(var j=0;j<els.length;j++){
        if(!els[j].classList.contains('done')&&!els[j].classList.contains('error')){
          els[j].className=(containerEl.id==='loadingSteps'?'loading-step done':'inline-step done');
          iconEl(j).innerHTML=ICON_DONE;
        }
      }
    },
    updateLabel:function(i,text){
      if(i<0||i>=els.length)return;
      els[i].querySelector('span:last-child').textContent=text;
    }
  };
}

/* ══════════════════════════════════════════
   Initial preload with detailed steps
   ══════════════════════════════════════════ */
async function preloadAll(){
  var bar=document.getElementById('loadingBar'),label=document.getElementById('loadingLabel');
  var stepsContainer=document.getElementById('loadingSteps');

  // Build step definitions
  var stepDefs=[{label:'Initializing connection to server...'}];
  ALL_SHEETS.forEach(function(s){stepDefs.push({label:'Fetching: '+sheetName(s)});});
  stepDefs.push({label:'Caching data locally'});
  stepDefs.push({label:'Setting up Manager info'});
  stepDefs.push({label:'Preparing user interface'});

  var tracker=createStepTracker(stepsContainer,stepDefs);
  var stepIdx=0;

  // Step 0: Initializing
  tracker.setActive(stepIdx);
  label.textContent='Connecting to server...';
  await new Promise(function(r){setTimeout(r,300);});
  tracker.setDone(stepIdx);
  stepIdx++;

  // Steps 1..N: Fetch each sheet
  var total=ALL_SHEETS.length;
  var loaded=0;
  await Promise.all(ALL_SHEETS.map(async function(s,si){
    var myIdx=stepIdx+si;
    tracker.setActive(myIdx);
    try{
      var r=await fetch(GAS_URL+'?sheets='+encodeURIComponent(s));
      var j=await r.json();
      cache[s]=j[s]||[];
    }catch(e){
      cache[s]=[];
      tracker.setError(myIdx);
      loaded++;
      bar.style.width=Math.round(loaded/total*85+5)+'%';
      label.textContent='Loading '+loaded+'/'+total+'...';
      return;
    }
    loaded++;
    tracker.setDone(myIdx);
    bar.style.width=Math.round(loaded/total*85+5)+'%';
    label.textContent='Loading '+loaded+'/'+total+'...';
  }));
  stepIdx+=total;

  // Caching step
  tracker.setActive(stepIdx);
  label.textContent='Caching data...';
  await new Promise(function(r){setTimeout(r,150);});
  tracker.setDone(stepIdx);
  stepIdx++;

  // Manager info step
  tracker.setActive(stepIdx);
  label.textContent='Loading manager info...';
  mgrData=cache['14_manager_infor']||[];
  await new Promise(function(r){setTimeout(r,150);});
  tracker.setDone(stepIdx);
  stepIdx++;

  // UI prep step
  tracker.setActive(stepIdx);
  label.textContent='Preparing interface...';
  await new Promise(function(r){setTimeout(r,200);});
  tracker.setDone(stepIdx);

  label.textContent='All data loaded successfully';
  bar.style.width='100%';
  tracker.setAllDone();
  setTimeout(function(){document.getElementById('loadingOverlay').classList.add('hidden');},500);
}

async function fetchSheet(s){if(cache[s])return cache[s];var r=await fetch(GAS_URL+'?sheets='+encodeURIComponent(s));var j=await r.json();cache[s]=j[s]||[];return cache[s];}
async function writeSheet(s,a,p){
  var maxRetries=3,lastErr;
  for(var i=0;i<maxRetries;i++){
    try{
      var controller=new AbortController();
      var tid=setTimeout(function(){controller.abort();},30000);
      var r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({sheet:s,action:a,data:p}),redirect:'follow',signal:controller.signal});
      clearTimeout(tid);
      var txt=await r.text();
      var j;
      try{j=JSON.parse(txt);}catch(pe){throw new Error('Server returned invalid response. Please retry.');}
      if(j.error)throw new Error(j.error);
      delete cache[s];
      return j;
    }catch(e){
      lastErr=e;
      if(e.name==='AbortError')lastErr=new Error('Request timed out. Please retry.');
      if(i<maxRetries-1)await new Promise(function(res){setTimeout(res,1500*(i+1));});
    }
  }
  throw lastErr;
}
async function sha256(m){var b=new TextEncoder().encode(m);var h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* ── Publication APA 포맷팅 ── */
function formatAPA(row){
  var text=esc(row.content||'');
  text=text.replace(/\.\s+([^.]+?),\s*(\d+)\(/g,'. <i>$1</i>, <i>$2</i>(');
  if(row.doi_link){
    text+=' <a href="'+esc(row.doi_link)+'" target="_blank" style="color:#4a7a9a;">'+esc(row.doi||row.doi_link)+'</a>';
  }else if(row.doi){
    text+=' '+esc(row.doi);
  }
  return text;
}

function openMgrModal(){var mgr=mgrData[0]||{};document.getElementById('mgrEmail').value=mgr.email||'';document.getElementById('mgrCurPw').value='';document.getElementById('mgrNewPw').value='';document.getElementById('mgrNewPw2').value='';document.getElementById('mgrMsg').textContent='';mgrModal.classList.add('open');}
document.getElementById('mgrSave').onclick=async function(){
  var email=document.getElementById('mgrEmail').value.trim(),cur=document.getElementById('mgrCurPw').value,nw=document.getElementById('mgrNewPw').value,nw2=document.getElementById('mgrNewPw2').value,msg=document.getElementById('mgrMsg');
  if(!email||!cur){msg.textContent='Email and current password required.';msg.className='mgr-msg status-err';return;}
  var mgr=mgrData[0]||{};
  if(await sha256(cur)!==(mgr.password||'').trim()){msg.textContent='Current password incorrect.';msg.className='mgr-msg status-err';return;}
  if(nw&&nw!==nw2){msg.textContent='Passwords do not match.';msg.className='mgr-msg status-err';return;}
  var btn=this;btn.disabled=true;btn.textContent='SAVING...';

  var tracker=showInlineLoadingSteps('Saving Manager Info',[
    {label:'Validating credentials'},
    {label:'Encrypting password'},
    {label:'Sending data to server'},
    {label:'Updating local data'},
    {label:'Finalizing'}
  ]);

  try{
    tracker.setActive(0);updateInlineBar(10);
    await new Promise(function(r){setTimeout(r,200);});
    tracker.setDone(0);

    tracker.setActive(1);updateInlineBar(25);
    var pwHash=nw?await sha256(nw):mgr.password;
    tracker.setDone(1);

    tracker.setActive(2);updateInlineBar(40);
    await writeSheet('14_manager_infor','update',{index:0,row:{no_:mgr.no_||'1',email:email,password:pwHash}});
    tracker.setDone(2);updateInlineBar(75);

    tracker.setActive(3);
    mgrData=[{no_:mgr.no_||'1',email:email,password:pwHash}];
    tracker.setDone(3);updateInlineBar(90);

    tracker.setActive(4);
    msg.textContent='Saved.';msg.className='mgr-msg status-ok';
    tracker.setDone(4);updateInlineBar(100);
  }catch(e){
    msg.textContent='Failed.';msg.className='mgr-msg status-err';
  }finally{
    btn.disabled=false;btn.textContent='SAVE CHANGES';
    hideInlineLoading();
  }
};

      html+='<iframe id="cvLinkIframe" src="'+iframeSrc+'" style="width:100%;height:72vh;border:none;" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>';
      html+='</div>';

      if(tracker){tracker.setDone(2);tracker.setActive(3);updateInlineBar(80);}
      contentArea.innerHTML=html;

      requestAnimationFrame(function(){
        var urlInput=document.getElementById('cvLinkUrl');
        var h=urlInput.offsetHeight;
        document.getElementById('cvLinkApplyBtn').style.height=h+'px';
      });

      document.getElementById('cvLinkApplyBtn').onclick=async function(){
        var btn=this;
        var url=document.getElementById('cvLinkUrl').value.trim();
        var msg=document.getElementById('cvLinkMsg');
        if(!url){msg.textContent='Please enter a URL.';msg.className='form-modal-msg status-err';return;}
        btn.disabled=true;btn.textContent='Saving...';msg.textContent='';

        var tk=showInlineLoadingSteps('Saving CV Link',[
          {label:'Preparing link data'},
          {label:'Generating timestamp'},
          {label:'Sending to server ('+sheetName(tab.sheet)+')'},
          {label:'Clearing cached data'},
          {label:'Loading document preview'}
        ]);
        try{
          tk.setActive(0);updateInlineBar(10);
          var now=new Date();
          var pad=function(n){return n<10?'0'+n:String(n);};
          tk.setDone(0);

          tk.setActive(1);updateInlineBar(20);
          var dateStr=now.getFullYear()+'/'+pad(now.getMonth()+1)+'/'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
          var rowData={no_:row.no_||row.no_num||'1',url:url,date:dateStr};
          tk.setDone(1);

          tk.setActive(2);updateInlineBar(35);
          if(rows.length>0){
            await writeSheet(tab.sheet,'update',{index:0,row:rowData});
          }else{
            await writeSheet(tab.sheet,'add',{row:rowData});
          }
          tk.setDone(2);updateInlineBar(65);

          tk.setActive(3);
          delete cache[tab.sheet];
          document.getElementById('cvLinkDate').value=dateStr;
          tk.setDone(3);updateInlineBar(80);

          tk.setActive(4);
          var editUrl=url.replace(/\/(edit|preview).*$/,'/edit');
          document.getElementById('cvLinkIframe').src=editUrl;
          document.getElementById('cvLinkPreviewWrap').style.display='';
          tk.setDone(4);updateInlineBar(100);

          msg.textContent='Saved.';msg.className='form-modal-msg status-ok';
          btn.textContent='Applied!';
          hideInlineLoading();
          setTimeout(function(){btn.textContent='Apply';btn.disabled=false;msg.textContent='';},1200);
        }catch(e){
          console.error(e);
          msg.textContent='Save failed.';msg.className='form-modal-msg status-err';
          btn.textContent='Apply';btn.disabled=false;
          hideInlineLoading();
        }
      };
      if(tracker){tracker.setDone(3);updateInlineBar(100);}
    }catch(e){console.error(e);contentArea.innerHTML='<p class="loading-text" style="color:#c66;">Load failed.</p>';}
    if(showOverlay)hideInlineLoading();
    return;
  }

  try{
    if(tracker){tracker.setDone(0);tracker.setActive(1);updateInlineBar(15);}
    var rows=await fetchSheet(tab.sheet);
    if(tracker){tracker.setDone(1);tracker.setActive(2);updateInlineBar(55);}

    currentData=rows.map(function(r,i){var c=JSON.parse(JSON.stringify(r));c._oi=i;return c;});
    if(tab.sortAsc)currentData.sort(function(a,b){return(Number(a.no_||a.no_num||0))-(Number(b.no_||b.no_num||0));});
    else currentData.sort(function(a,b){return(Number(b.no_||b.no_num||0))-(Number(a.no_||a.no_num||0));});
    if(tab.type==='teaching'||tab.type==='teaching2'){
      currentData.sort(function(a,b){
        var ca=String(a.category||'0')==='1'?0:1;
        var cb=String(b.category||'0')==='1'?0:1;
        if(ca!==cb)return ca-cb;
        return(Number(b.no_||b.no_num||0))-(Number(a.no_||a.no_num||0));
      });
    }
    if(tracker){tracker.setDone(2);tracker.setActive(3);updateInlineBar(80);}
    renderCards(tab,currentData);
    if(tracker){tracker.setDone(3);updateInlineBar(100);}
  }catch(e){console.error(e);contentArea.innerHTML='<p class="loading-text" style="color:#c66;">Load failed.</p>';}
  if(showOverlay)hideInlineLoading();
}

/* ── Open / Close ── */
window.toggleOpen=function(idx){
  var card=document.getElementById('card-'+idx);
  var body=card.querySelector('.card-body');
  var existing=body.querySelector('.card-detail');
  var actionsDiv=card.querySelector('.card-actions');
  if(existing){
    existing.remove();
    card.classList.remove('card-open');
    actionsDiv.innerHTML='<button class="btn btn-open" onclick="toggleOpen('+idx+')">Open</button>';
  }else{
    card.classList.add('card-open');
    body.insertAdjacentHTML('beforeend',renderCardDetail(currentTab,currentData[idx]));
    actionsDiv.innerHTML='<button class="btn btn-modify" onclick="startEdit('+idx+')">Modify</button> <button class="btn btn-open" onclick="toggleOpen('+idx+')">Close</button>';
  }
};

/* ── Edit ── */
window.startEdit=function(idx){
  var card=document.getElementById('card-'+idx);var row=currentData[idx];var cols=Object.keys(row);var isDsp=String(row.dsp||'1')!=='0';
  card.classList.add('editing');card.classList.remove('dsp-off');card.style.paddingRight='1.3em';
  var body=card.querySelector('.card-body');
  var html='<div class="edit-topbar"><div class="toggle-wrap" onclick="this.querySelector(\'.toggle-track\').classList.toggle(\'on\')"><div class="toggle-track'+(isDsp?' on':'')+'"><div class="toggle-knob"></div></div><span>Show in CV</span></div>';
  html+='<div class="edit-topbar-btns"><button class="btn btn-save" onclick="saveEdit('+idx+')">Save</button><button class="btn btn-cancel" onclick="cancelEdit('+idx+')">Cancel</button><button class="btn btn-del" onclick="deleteRow('+idx+')">Delete</button></div></div>';
  cols.forEach(function(c){
    if(c==='no_num'||c==='no_'||c==='dsp'||c==='_oi')return;
    var v=row[c]!==undefined?String(row[c]):'';
    var isLong=v.length>50||c==='content'||c==='thesis'||c.indexOf('description')>=0||c.indexOf('role')>=0;
    html+='<div class="edit-row"><label>'+esc(getLabel(c))+'</label>';
    if((c==='abstract_link'||c==='abstrat_link')&&v){
      html+='<div class="edit-row-inline"><input data-col="'+esc(c)+'" value="'+esc(v)+'"><button class="btn-preview" type="button" onclick="openPreview(this.previousElementSibling.value)">Preview</button></div>';
    }else if(isLong){
      html+='<textarea data-col="'+esc(c)+'">'+esc(v)+'</textarea>';
    }else{
      html+='<input data-col="'+esc(c)+'" value="'+esc(v)+'">';
    }
    html+='</div>';
  });
  body.innerHTML=html;
  card.querySelector('.card-actions').style.display='none';
};
/* ── Re-render single card in open state ── */
function rerenderCardOpen(idx){
  var row=currentData[idx];
  var isDsp=String(row.dsp||'1')!=='0';
  var isCatHead=(currentTab.type==='teaching'||currentTab.type==='teaching2')&&String(row.category||'0')==='1';
  var card=document.getElementById('card-'+idx);
  card.className='card card-open'+(isDsp?'':' dsp-off')+(isCatHead?' cat-head':'');
  card.style.paddingRight='';
  card.innerHTML='<div class="card-top"><div class="card-controls"><button class="btn-arrow" onclick="moveRow('+idx+',-1)">▲</button><button class="btn-arrow" onclick="moveRow('+idx+',1)">▼</button></div>'
    +'<div class="card-body"><div class="card-content">'+renderCardSummary(currentTab,row)+'</div>'+renderCardDetail(currentTab,row)+'</div></div>'
    +'<div class="card-actions"><button class="btn btn-modify" onclick="startEdit('+idx+')">Modify</button> <button class="btn btn-open" onclick="toggleOpen('+idx+')">Close</button></div>';
}

window.saveEdit=async function(idx){
  var card=document.getElementById('card-'+idx);
  var saveBtn=card.querySelector('.btn-save');
  var fields=card.querySelectorAll('[data-col]');
  var rowData={};
  fields.forEach(function(f){rowData[f.dataset.col]=f.value;});
  var row=currentData[idx];
  if(row.no_!==undefined)rowData.no_=row.no_;
  if(row.no_num!==undefined)rowData.no_num=row.no_num;
  rowData.dsp=card.querySelector('.toggle-track').classList.contains('on')?'1':'0';
  saveBtn.disabled=true;saveBtn.textContent='Saving...';

  var tracker=showInlineLoadingSteps('Saving Changes',[
    {label:'Collecting modified field values'},
    {label:'Validating display status (dsp)'},
    {label:'Sending update to server ('+sheetName(currentTab.sheet)+')'},
    {label:'Applying changes to local cache'},
    {label:'Re-rendering card view'}
  ]);

  try{
    tracker.setActive(0);updateInlineBar(10);
    await new Promise(function(r){setTimeout(r,150);});
    tracker.setDone(0);

    tracker.setActive(1);updateInlineBar(20);
    await new Promise(function(r){setTimeout(r,100);});
    tracker.setDone(1);

    tracker.setActive(2);updateInlineBar(30);
    await writeSheet(currentTab.sheet,'update',{index:row._oi,row:rowData});
    tracker.setDone(2);updateInlineBar(65);

    tracker.setActive(3);
    Object.keys(rowData).forEach(function(k){currentData[idx][k]=rowData[k];});
    var sorted=[].concat(currentData).sort(function(a,b){return a._oi-b._oi;});
    cache[currentTab.sheet]=sorted.map(function(r){var c=JSON.parse(JSON.stringify(r));delete c._oi;return c;});
    tracker.setDone(3);updateInlineBar(85);

    tracker.setActive(4);
    saveBtn.textContent='Saved!';
    tracker.setDone(4);updateInlineBar(100);
    setTimeout(function(){rerenderCardOpen(idx);hideInlineLoading();},600);
  }catch(e){
    console.error(e);saveBtn.textContent='Failed!';saveBtn.disabled=false;
    hideInlineLoading();alert('Save failed: '+e.message);
  }
};

window.cancelEdit=function(idx){
  rerenderCardOpen(idx);
};

window.deleteRow=async function(idx){
  if(!confirm('Delete this item?'))return;

  var tracker=showInlineLoadingSteps('Deleting Item',[
    {label:'Sending delete request to server'},
    {label:'Removing from "'+sheetName(currentTab.sheet)+'" sheet'},
    {label:'Clearing cached data'},
    {label:'Reloading tab data from server'},
    {label:'Re-rendering card list'}
  ]);

  try{
    tracker.setActive(0);updateInlineBar(10);
    tracker.setActive(1);updateInlineBar(20);
    await writeSheet(currentTab.sheet,'delete',{index:currentData[idx]._oi});
    tracker.setDone(0);tracker.setDone(1);updateInlineBar(50);

    tracker.setActive(2);
    delete cache[currentTab.sheet];
    tracker.setDone(2);updateInlineBar(60);

    tracker.setActive(3);updateInlineBar(65);
    // loadTab will handle steps 3-4 via its own rendering
    await loadTab(currentTab,false);
    tracker.setDone(3);updateInlineBar(90);

    tracker.setActive(4);
    tracker.setDone(4);updateInlineBar(100);
    hideInlineLoading();
  }catch(e){
    console.error(e);
    hideInlineLoading();
    alert('Delete failed: '+e.message);
  }
};

/* ── Move (visual only) ── */
window.moveRow=function(idx,dir){var target=idx+dir;if(target<0||target>=currentData.length)return;var k=currentData[0].no_!==undefined?'no_':'no_num';var tmp=currentData[idx][k];currentData[idx][k]=currentData[target][k];currentData[target][k]=tmp;if(currentTab.sortAsc)currentData.sort(function(a,b){return(Number(a[k]||0))-(Number(b[k]||0));});else currentData.sort(function(a,b){return(Number(b[k]||0))-(Number(a[k]||0));});sortDirty=true;renderCards(currentTab,currentData);};

window.saveSort=async function(){
  var btn=document.getElementById('btnSort');
  btn.textContent='Saving...';btn.disabled=true;
  var total=currentData.length;

  var stepDefs=[{label:'Preparing sort order data'}];
  for(var si=0;si<total;si++){
    stepDefs.push({label:'Updating item '+(si+1)+'/'+total});
  }
  stepDefs.push({label:'Updating local cache'});
  stepDefs.push({label:'Refreshing card display'});

  var tracker=showInlineLoadingSteps('Saving Sort Order',stepDefs);

  try{
    tracker.setActive(0);updateInlineBar(5);
    await new Promise(function(r){setTimeout(r,100);});
    tracker.setDone(0);

    for(var i=0;i<currentData.length;i++){
      var sIdx=i+1;
      tracker.setActive(sIdx);
      updateInlineBar(5+Math.round(i/total*80));
      var rd=JSON.parse(JSON.stringify(currentData[i]));
      delete rd._oi;
      await writeSheet(currentTab.sheet,'update',{index:currentData[i]._oi,row:rd});
      tracker.setDone(sIdx);
    }

    var cacheIdx=total+1;
    tracker.setActive(cacheIdx);updateInlineBar(90);
    sortDirty=false;
    var sorted2=[].concat(currentData).sort(function(a,b){return a._oi-b._oi;});
    cache[currentTab.sheet]=sorted2.map(function(r){var c=JSON.parse(JSON.stringify(r));delete c._oi;return c;});
    tracker.setDone(cacheIdx);

    var renderIdx=total+2;
    tracker.setActive(renderIdx);updateInlineBar(95);
    renderCards(currentTab,currentData);
    tracker.setDone(renderIdx);updateInlineBar(100);

    hideInlineLoading();
  }catch(e){
    console.error(e);
    hideInlineLoading();
    alert('Sort save failed: '+e.message);
  }finally{
    btn.textContent='Save (Sort)';btn.disabled=false;
  }
};

/* ── Add Modal ── */
var addModal=document.getElementById('addModal');
document.getElementById('addModalCancel').onclick=function(){addModal.classList.remove('open');};
addModal.onclick=function(e){if(e.target===addModal)addModal.classList.remove('open');};
window.openAddModal=function(){if(!currentData.length){alert('No column info.');return;}var cols=Object.keys(currentData[0]);var container=document.getElementById('addFields');var html='';cols.forEach(function(c){if(c==='no_num'||c==='no_'||c==='dsp'||c==='_oi')return;var isLong=c==='content'||c==='thesis'||c.indexOf('description')>=0||c.indexOf('role')>=0;html+='<div class="edit-row"><label>'+esc(getLabel(c))+'</label>';if(isLong)html+='<textarea data-col="'+esc(c)+'"></textarea>';else html+='<input data-col="'+esc(c)+'" value="">';html+='</div>';});container.innerHTML=html;document.getElementById('addModalMsg').textContent='';addModal.classList.add('open');};

document.getElementById('addModalSave').onclick=async function(){
  var fields=document.getElementById('addFields').querySelectorAll('[data-col]');
  var rowData={};
  fields.forEach(function(f){rowData[f.dataset.col]=f.value;});
  var k=currentData[0].no_!==undefined?'no_':'no_num';
  var maxNo=currentData.reduce(function(mx,r){return Math.max(mx,Number(r[k]||0));},0);
  rowData[k]=String(maxNo+1);
  rowData.dsp='1';
  var msg=document.getElementById('addModalMsg');
  var btn=this;
  btn.disabled=true;btn.textContent='Saving...';

  var tracker=showInlineLoadingSteps('Adding New Item',[
    {label:'Preparing record data (ID: '+(maxNo+1)+')'},
    {label:'Setting display status to visible'},
    {label:'Sending new record to server ('+sheetName(currentTab.sheet)+')'},
    {label:'Clearing cached data'},
    {label:'Reloading tab with updated data'},
    {label:'Finalizing'}
  ]);

  try{
    tracker.setActive(0);updateInlineBar(8);
    await new Promise(function(r){setTimeout(r,100);});
    tracker.setDone(0);

    tracker.setActive(1);updateInlineBar(15);
    await new Promise(function(r){setTimeout(r,80);});
    tracker.setDone(1);

    tracker.setActive(2);updateInlineBar(25);
    await writeSheet(currentTab.sheet,'add',{row:rowData});
    tracker.setDone(2);updateInlineBar(55);

    tracker.setActive(3);
    delete cache[currentTab.sheet];
    tracker.setDone(3);updateInlineBar(65);

    msg.textContent='Added.';msg.className='form-modal-msg status-ok';
    tracker.setActive(4);updateInlineBar(70);

    setTimeout(async function(){
      addModal.classList.remove('open');
      await loadTab(currentTab,false);
      tracker.setDone(4);updateInlineBar(95);
      tracker.setActive(5);
      tracker.setDone(5);updateInlineBar(100);
      hideInlineLoading();
    },400);
  }catch(e){
    msg.textContent='Failed.';msg.className='form-modal-msg status-err';
    hideInlineLoading();
  }finally{
    btn.disabled=false;btn.textContent='Save';
  }
};

buildTabs();preloadAll().then(function(){document.querySelector('.mng-tab').click();});

/* ── Modal Drag ── */
(function(){
  var modal=document.getElementById('addModalContent');
  var header=modal.querySelector('.form-modal-header');
  var dragging=false,startX,startY,origX,origY;
  header.addEventListener('mousedown',function(e){
    if(e.target.tagName==='BUTTON')return;
    dragging=true;
    var rect=modal.getBoundingClientRect();
    startX=e.clientX;startY=e.clientY;
    origX=rect.left;origY=rect.top;
    modal.style.position='fixed';
    modal.style.left=origX+'px';
    modal.style.top=origY+'px';
    modal.style.margin='0';
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    modal.style.left=(origX+e.clientX-startX)+'px';
    modal.style.top=(origY+e.clientY-startY)+'px';
  });
  document.addEventListener('mouseup',function(){dragging=false;});
  var obs=new MutationObserver(function(){
    if(!document.getElementById('addModal').classList.contains('open')){
      modal.style.position='';modal.style.left='';modal.style.top='';modal.style.margin='';
    }
  });
  obs.observe(document.getElementById('addModal'),{attributes:true,attributeFilter:['class']});
})();
